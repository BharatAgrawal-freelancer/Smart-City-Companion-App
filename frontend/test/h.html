<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Puzzle Itinerary Planner</title>

  <!-- External CSS -->
  <style>
    body {
      font-family: sans-serif;
      background-color: #f0f2f5;
    }

    #canvas {
      width: 100%;
      height: 90vh;
      background: #eaf0f8;
      position: relative;
      overflow: hidden;
    }

    .puzzle-piece {
      width: 120px;
      height: 120px;
      background-color: #ffffff;
      border: 3px solid #4a90e2;
      position: absolute;
      text-align: center;
      padding: 10px;
      box-sizing: border-box;
      user-select: none;
      border-radius: 12px;
      clip-path: polygon(
        10% 0%, 90% 0%, 100% 10%, 100% 90%,
        90% 100%, 10% 100%, 0% 90%, 0% 10%
      );
      cursor: move;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .clump-group {
      border: 2px dashed #ff7f50;
      background-color: rgba(255, 127, 80, 0.1);
      border-radius: 16px;
      position: absolute;
      padding: 10px;
    }
  </style>
</head>
<body>

  <h3 style="text-align:center;">Itinerary Puzzle Planner 🧩</h3>
  <div id="canvas"></div>

  <!-- Libraries -->
  <script src="https://cdn.jsdelivr.net/npm/interactjs/dist/interact.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/leader-line/leader-line.min.js"></script>

  <script>
    const canvas = document.getElementById('canvas');

    // Create Puzzle Pieces
    const pieces = [
      { text: "Destination", x: 50, y: 50, id: "destination" },
      { text: "Travel Medium", x: 50, y: 250, id: "travel" },
      { text: "Travel Budget", x: 250, y: 250, id: "budget" },
      { text: "Comfort", x: 250, y: 450, id: "comfort" },
    ];

    pieces.forEach(piece => {
      const div = document.createElement('div');
      div.className = 'puzzle-piece';
      div.innerText = piece.text;
      div.id = piece.id;
      div.style.left = piece.x + 'px';
      div.style.top = piece.y + 'px';
      canvas.appendChild(div);
    });

    // Drag & Drop + Snapping
    interact('.puzzle-piece').draggable({
      inertia: true,
      modifiers: [
        interact.modifiers.snap({
          targets: [
            interact.createSnapGrid({ x: 20, y: 20 })
          ],
          range: Infinity,
          relativePoints: [{ x: 0.5, y: 0.5 }]
        })
      ],
      listeners: {
        move (event) {
          const target = event.target;
          const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
          const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;

          target.style.transform = 'translate(' + x + 'px, ' + y + 'px)';

          target.setAttribute('data-x', x);
          target.setAttribute('data-y', y);

          // Update line positions
          updateLines();
        }
      }
    });

    // Define which pieces should clump
    const clumpGroup = document.createElement('div');
    clumpGroup.className = 'clump-group';
    clumpGroup.style.left = '400px';
    clumpGroup.style.top = '100px';
    clumpGroup.style.width = '300px';
    clumpGroup.style.height = '300px';
    canvas.appendChild(clumpGroup);

    const travel = document.getElementById('travel');
    const budget = document.getElementById('budget');

    // Move clump items inside the clump group
    clumpGroup.appendChild(travel);
    clumpGroup.appendChild(budget);

    travel.style.position = 'relative';
    travel.style.left = '20px';
    travel.style.top = '20px';

    budget.style.position = 'relative';
    budget.style.left = '160px';
    budget.style.top = '-80px';

    // LeaderLine Arrows
    let lines = [];

    function updateLines() {
      lines.forEach(line => line.remove());
      lines = [];

      const dest = document.getElementById('destination');
      const travel = document.getElementById('travel');
      const comfort = document.getElementById('comfort');

      lines.push(new LeaderLine(
        LeaderLine.pointAnchor(dest, { x: '100%', y: '50%' }),
        LeaderLine.pointAnchor(clumpGroup, { x: '0%', y: '50%' }),
        { color: '#4a90e2', size: 4, path: 'fluid' }
      ));

      lines.push(new LeaderLine(
        LeaderLine.pointAnchor(clumpGroup, { x: '100%', y: '50%' }),
        LeaderLine.pointAnchor(comfort, { x: '0%', y: '50%' }),
        { color: '#4a90e2', size: 4, path: 'fluid' }
      ));
    }

    updateLines();

    // Clump dragging
    interact('.clump-group').draggable({
      inertia: true,
      listeners: {
        move (event) {
          const target = event.target;
          const x = (parseFloat(target.getAttribute('data-x')) || 0) + event.dx;
          const y = (parseFloat(target.getAttribute('data-y')) || 0) + event.dy;

          target.style.transform = 'translate(' + x + 'px, ' + y + 'px)';

          target.setAttribute('data-x', x);
          target.setAttribute('data-y', y);

          // Update the lines when clump moves
          updateLines();
        }
      }
    });

  </script>
</body>
</html>
