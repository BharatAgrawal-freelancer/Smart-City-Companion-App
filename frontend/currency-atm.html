<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nearby ATMs and Banks (No API Key)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
      background: #f0f0f0;
    }
    .container {
      max-width: 600px;
      margin: 0 auto;
      background-color: white;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }
    input, button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      font-size: 16px;
    }
    iframe {
      width: 100%;
      height: 500px;
      border: none;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Find ATMs and Banks Nearby</h2>
    <input type="text" id="locationInput" placeholder="Enter a location (e.g., Delhi)">
    <button onclick="updateMap()">Search</button>

    <iframe
      id="mapFrame"
      src="https://www.google.com/maps?q=ATM+and+Bank+near+India&output=embed"
      allowfullscreen
      loading="lazy">
    </iframe>
  </div>

  <script>
    function updateMap() {
      const location = document.getElementById("locationInput").value.trim();

      if (!location) {
        alert("Please enter a location.");
        return;
      }

      const query = `ATM and Bank near ${encodeURIComponent(location)}`;
      const mapUrl = `https://www.google.com/maps?q=${query}&output=embed`;

      document.getElementById("mapFrame").src = mapUrl;
    }
  </script>

</body>
</html>
