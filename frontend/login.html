<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
    <h2>Login to Smart City Companion</h2>
    <form id="loginForm">
        <input type="email" placeholder="Email" name="email" required><br>
        <input type="password" placeholder="Password" name="password" required><br>
        <button type="submit">Login</button>
    </form>

    <script>
        const form = document.getElementById('loginForm');
    
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
    
            const formData = new FormData(form);
            const data = {};
            formData.forEach((value, key) => data[key] = value);
    
            try {
                const res = await fetch('http://localhost:5000/api/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
    
                const result = await res.json();
    
                // If login is successful (assuming backend returns user data)
                if (res.ok && result.user) {
                    alert('Login Successful!');
    
                    // Store email in localStorage as token
                    localStorage.setItem('token', result.user.email);
    
                    // Redirect to dashboard
                    window.location.href = 'dashboard.html';
                } else {
                    alert(result.msg || 'Login failed. Try again.');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Something went wrong. Please try again later.');
            }
        });
    </script>
    
</body>
</html>
