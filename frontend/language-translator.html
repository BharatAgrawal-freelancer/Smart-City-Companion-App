<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Language Translator</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    #result { margin-top: 20px; padding: 10px; border: 1px solid #ccc; }
    textarea { width: 100%; height: 100px; }
    select, button { margin-top: 10px; padding: 10px; width: 100%; }
  </style>
</head>
<body>

  <h2>Language Translator</h2>

  <textarea id="inputText" placeholder="Type text to translate..."></textarea>
  <select id="targetLang">
    <option value="en">English</option>
    <option value="hi">Hindi</option>
    <option value="fr">French</option>
    <option value="de">German</option>
    <option value="es">Spanish</option>
    <!-- Add more languages as needed -->
  </select>
  <button onclick="translateText()">Translate</button>

  <div id="result"></div>

  <h3>Chat History</h3>
  <ul id="chatHistory"></ul>

  <script>
    async function translateText() {
      const inputText = document.getElementById('inputText').value;
      const targetLang = document.getElementById('targetLang').value;

      if (!inputText) {
        alert("Please enter text to translate!");
        return;
      }

      const res = await fetch('http://localhost:5000/api/translate', {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ inputText, targetLang })
      });

      const data = await res.json();

      if (data.success) {
        document.getElementById('result').innerText = `Translated: ${data.data.translatedText}`;
        loadChatHistory();
      } else {
        alert(data.message);
      }
    }

    async function loadChatHistory() {
      const res = await fetch('http://localhost:5000/api/chats');
      const data = await res.json();

      const chatList = document.getElementById('chatHistory');
      chatList.innerHTML = '';

      data.data.forEach(chat => {
        const li = document.createElement('li');
        li.innerText = `${chat.inputText} ➡️ ${chat.translatedText} [${chat.targetLang}]`;
        chatList.appendChild(li);
      });
    }

    // Load on page load
    loadChatHistory();
  </script>

</body>
</html>
